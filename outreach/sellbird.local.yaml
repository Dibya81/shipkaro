# Sellbird config for ShipKaro.
# setup.sh copies this to outreach/sellbird/sellbird.local.yaml (the file Sellbird reads).
# Edit this copy, then run ./setup.sh again (or edit the copy inside sellbird/ directly).

persona:
  name: "Dibya"
  company: "ShipKaro"
  role: "Founder"
  email: "hello@shipkaro.com"          # TODO: the mailbox you actually send from
  linkedin: ""
  tone: "friendly, direct, plain Indian English, no jargon"

product:
  name: "ShipKaro custom software"
  description: >-
    ShipKaro builds custom software for local businesses in India: gym and fitness
    management, PG and hostel management, clinic appointments and billing, coaching
    and school ERP, restaurant POS, inventory and GST billing, booking systems,
    WhatsApp bots, mobile apps and fast business websites. Also personal portfolio
    and practice websites for doctors, dentists and growing clinics anywhere in the
    world (India, Nepal, the US and beyond): profile, treatments, reviews, location
    and online appointment booking. Fixed quote, work starts the same day, full
    source code handed over.
  pricing: "Fixed quote per project. Websites from ₹1,999. 50% advance (UPI in India; bank transfer or PayPal internationally), 50% on delivery."
  key_benefits:
    - "Fixed quote in a day, work starts the same day"
    - "Built around how the business already runs: registers, WhatsApp, UPI"
    - "Full source code handover, no monthly lock-in"
    - "Progress shared on WhatsApp with screens to try at every milestone"
    - "Pay 50% to start and 50% only after delivery"
    - "For doctors: a professional site with online booking makes a growing practice look established"
  objection_responses:
    "already have a website": "Makes sense. Is it bringing in bookings? If it's slow on phones or has no booking button, that's usually the quick win."
    "are you local": "We work fully online with clients in several countries. You see every screen before paying the balance."
    "too expensive": "Totally fair. We give a fixed price before anything starts, and you can begin with just the one screen that saves you the most time."
    "already have a solution": "Makes sense. What's the one thing it makes you still do by hand or in a register? That's usually where we help."
    "not interested": "No problem at all. If renewals, dues or bookings ever get messy, just reply here."
    "no time": "We do the work. You spend 15 minutes telling us how things run today, and we come back with screens to try."
  offer:
    primary: "Custom management software or website, fixed quote, 50% advance"
    # What the FIRST email offers for free. Change it to whatever you can deliver
    # within a few days of a yes (dashboard → Your company → Your offer).
    entry: "a free mockup of the dashboard their business would use, built around how they run today"
    entry_ideas:
      - "a free mockup of the dashboard their business would use, built around how they run today"
      - "a free homepage mockup with online booking and a WhatsApp button"
      - "a free one-page plan for moving their register onto a simple app"
      - "a free homepage mockup of their practice website with online appointment booking (doctors, dentists)"
      - "a free personal profile page they can share with patients, built from their public details"
    goal: "get_reply"
    booking_method: "ask_preference"
    booking_url: ""
    meeting_duration: "15 minutes"
    meeting_owner: "Dibya, founder of ShipKaro"

