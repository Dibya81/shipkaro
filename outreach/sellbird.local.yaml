channels:
  email:
    enabled: true
    provider: "gmail"            # gmail | microsoft | smtp
    max_daily_sends: 30
    require_approval: true        # every email waits in the Outbox for you
    link_domains: ["shipkaro-omega.vercel.app"]
    send_to_risky: false
    max_bounce_rate: 0.05
    warmup:
      start_date: ""             # YYYY-MM-DD the day warmup started on the sending mailbox
      min_days: 14
      start_sends: 5
      daily_increase: 3
    send_window:
      start: "10:00"
      end: "18:00"
      weekdays_only: true
      recipient_timezone: true   # each prospect gets email in their own office hours
  linkedin:
    enabled: false

usage:
  max_daily_claude_percent: 40   # leaves most of your Claude plan for your own work
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "21:00"
    end: "09:00"
    timezone: "Asia/Kolkata"

compliance:
  postal_address: ""             # TODO: a business address you receive mail at
  opt_out_line: "Not useful right now? Just reply and I won't email again."
  do_not_contact: []

# Anyone who says yes to the offer is sent to the ShipKaro admin dashboard
# (Requests tab, plus a Telegram ping) through outreach/shipkaro_bridge.py.
handoff:
  mcp_command: ["__VENV_PYTHON__", "__BRIDGE__"]
  tool: create_lead
  arguments:
    name: "{first_name} {last_name}"
    email: "{email}"
    company: "{company}"
    website: "{website}"
    title: "{title}"
    offer: "{offer}"
    reply: "{reply}"
